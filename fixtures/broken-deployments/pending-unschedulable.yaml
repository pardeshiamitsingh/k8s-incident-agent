# Expected symptom: describe.phase == "Pending", events include a
# "FailedScheduling" reason with the scheduler's message (insufficient cpu).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-unschedulable
  labels:
    app: pending-unschedulable
    incident-agent-fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-unschedulable
  template:
    metadata:
      labels:
        app: pending-unschedulable
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "1000"
              memory: "1000Gi"

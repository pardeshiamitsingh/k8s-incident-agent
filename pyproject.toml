[project]
name = "k8s-incident-agent"
version = "0.1.0"
description = "Local, RAG-backed AI agent that diagnoses Kubernetes incidents and proposes remediation plans."
authors = [
    { name = "pardeshiamitsingh", email = "23156180+pardeshiamitsingh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=31.0.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collectors"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live kind/minikube cluster",
]

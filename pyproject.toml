[project]
name = "k8s-incident-agent"
version = "0.1.0"
description = "Local, RAG-backed AI agent that diagnoses Kubernetes incidents and proposes remediation plans."
authors = [
    { name = "pardeshiamitsingh", email = "23156180+pardeshiamitsingh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=31.0.0",
    "pydantic>=2.9.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.2.0",
    "langgraph>=0.2.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collectors", "knowledge_base", "agent", "intake", "api"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live kind/minikube cluster",
    "requires_ollama: requires a local Ollama server with nomic-embed-text pulled",
]

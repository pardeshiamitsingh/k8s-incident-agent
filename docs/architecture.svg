<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" role="img" aria-label="Sequence diagram: an engineer calls the HTTP API, which resolves the object against Kubernetes, then runs a five-step agent graph (collect, classify, retrieve, diagnose, plan) that reads Kubernetes, a local Chroma vector store, and a local Ollama model, before returning a diagnosis. A separate postmortem endpoint writes confirmed-correct outcomes back into the same Chroma store.">
  <style>
    :root {
      --bg:#F5F6F8; --surface:#FFFFFF; --text:#1A1D23; --text-2:#5B6270;
      --border:#D7DAE0; --agent:#3B5BDB; --agent-soft:#EBEEFC;
      --ext:#0F766E; --ext-soft:#E6F3F1; --loop:#B8631A; --loop-soft:#FBEEE1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#14161B; --surface:#1D2027; --text:#E7E9EE; --text-2:#9CA3AF;
        --border:#333844; --agent:#8EA0F7; --agent-soft:#242A45;
        --ext:#37D2BE; --ext-soft:#17302E; --loop:#E8A33D; --loop-soft:#3A2A13;
      }
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <rect x="0" y="0" width="1220" height="720" rx="16" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text)"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--loop)"/>
    </marker>
  </defs>

  <text x="600" y="16" text-anchor="middle" font-size="12" fill="var(--text)" opacity="0.7">POST /diagnose</text>

  <!-- Engineer -->
  <rect x="490" y="24" width="220" height="56" rx="10" fill="none" stroke="var(--text)" stroke-width="1.6"/>
  <text x="600" y="57" text-anchor="middle" font-size="15" font-weight="600" fill="var(--text)" class="sans">Engineer / client</text>

  <!-- request/response arrows -->
  <line x1="565" y1="80" x2="565" y2="118" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="558" y="102" text-anchor="end" font-size="11.5" fill="var(--text-2)">POST /diagnose</text>
  <line x1="655" y1="118" x2="655" y2="80" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="662" y="102" text-anchor="start" font-size="11.5" fill="var(--text-2)">202 job_id</text>

  <!-- API -->
  <rect x="400" y="120" width="400" height="100" rx="10" fill="var(--agent-soft)" stroke="var(--agent)" stroke-width="1.8"/>
  <text x="600" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="var(--agent)" class="sans">HTTP API</text>
  <text x="600" y="176" text-anchor="middle" font-size="11.5" fill="var(--text-2)">bearer-token auth on every request</text>
  <text x="600" y="200" text-anchor="middle" font-size="11.5" fill="var(--text-2)">GET /diagnose/{id} · POST /diagnose/{id}/postmortem</text>

  <!-- API -> Intake -->
  <line x1="560" y1="220" x2="560" y2="256" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="567" y="242" font-size="11.5" fill="var(--text-2)">namespace, name</text>

  <!-- Intake -->
  <rect x="440" y="256" width="240" height="60" rx="10" fill="var(--agent-soft)" stroke="var(--agent)" stroke-width="1.8"/>
  <text x="560" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="var(--agent)" class="sans">Resolve intake</text>
  <text x="560" y="302" text-anchor="middle" font-size="11" fill="var(--text-2)">resolve_intake()</text>

  <!-- Intake -> K8s#1 -->
  <line x1="680" y1="286" x2="896" y2="286" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="788" y="279" text-anchor="middle" font-size="11" fill="var(--text-2)">get Pod / Deployment</text>

  <!-- K8s#1 -->
  <rect x="900" y="256" width="220" height="60" rx="10" fill="var(--ext-soft)" stroke="var(--ext)" stroke-width="1.8"/>
  <text x="1010" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ext)" class="sans">Kubernetes API</text>
  <text x="1010" y="302" text-anchor="middle" font-size="11" fill="var(--text-2)">read-only ServiceAccount</text>

  <!-- Intake -> Agent graph -->
  <line x1="560" y1="316" x2="560" y2="354" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="567" y="340" font-size="11" fill="var(--text-2)">ObjectRef -&gt; job created</text>

  <!-- Agent graph container -->
  <rect x="60" y="354" width="1080" height="232" rx="14" fill="none" stroke="var(--agent)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="82" y="380" font-size="13" font-weight="600" fill="var(--agent)" class="sans">Agent graph — background thread (LangGraph)</text>

  <!-- nodes -->
  <rect x="90" y="432" width="190" height="64" rx="9" fill="var(--agent-soft)" stroke="var(--agent)" stroke-width="1.6"/>
  <text x="185" y="469" text-anchor="middle" font-size="14" font-weight="600" fill="var(--agent)" class="sans">Collect</text>

  <rect x="305" y="432" width="190" height="64" rx="9" fill="var(--agent-soft)" stroke="var(--agent)" stroke-width="1.6"/>
  <text x="400" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="var(--agent)" class="sans">Classify</text>
  <text x="400" y="479" text-anchor="middle" font-size="10" fill="var(--text-2)">no LLM call</text>

  <rect x="520" y="432" width="190" height="64" rx="9" fill="var(--agent-soft)" stroke="var(--agent)" stroke-width="1.6"/>
  <text x="615" y="469" text-anchor="middle" font-size="14" font-weight="600" fill="var(--agent)" class="sans">Retrieve</text>

  <rect x="735" y="432" width="190" height="64" rx="9" fill="var(--agent-soft)" stroke="var(--agent)" stroke-width="1.6"/>
  <text x="830" y="469" text-anchor="middle" font-size="14" font-weight="600" fill="var(--agent)" class="sans">Diagnose</text>

  <rect x="950" y="432" width="190" height="64" rx="9" fill="var(--agent-soft)" stroke="var(--agent)" stroke-width="1.6"/>
  <text x="1045" y="469" text-anchor="middle" font-size="14" font-weight="600" fill="var(--agent)" class="sans">Plan</text>

  <!-- inter-node arrows -->
  <line x1="280" y1="464" x2="301" y2="464" stroke="var(--agent)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="495" y1="464" x2="516" y2="464" stroke="var(--agent)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="710" y1="464" x2="731" y2="464" stroke="var(--agent)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="925" y1="464" x2="946" y2="464" stroke="var(--agent)" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Collect -> K8s#2 -->
  <line x1="185" y1="496" x2="185" y2="614" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="192" y="564" font-size="11" fill="var(--text-2)">collect_evidence()</text>
  <rect x="90" y="616" width="190" height="60" rx="10" fill="var(--ext-soft)" stroke="var(--ext)" stroke-width="1.8"/>
  <text x="185" y="642" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ext)" class="sans">Kubernetes API</text>
  <text x="185" y="661" text-anchor="middle" font-size="11" fill="var(--text-2)">same read-only client</text>

  <!-- Retrieve -> Chroma -->
  <line x1="615" y1="496" x2="615" y2="614" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="622" y="564" font-size="11" fill="var(--text-2)">similarity search</text>

  <!-- Retrieve -> Ollama (embed) -->
  <line x1="700" y1="496" x2="745" y2="614" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Chroma -->
  <rect x="520" y="616" width="190" height="70" rx="10" fill="var(--ext-soft)" stroke="var(--ext)" stroke-width="1.8"/>
  <text x="615" y="642" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ext)" class="sans">Chroma</text>
  <text x="615" y="661" text-anchor="middle" font-size="10.5" fill="var(--text-2)">12 runbooks +</text>
  <text x="615" y="675" text-anchor="middle" font-size="10.5" fill="var(--text-2)">postmortems</text>

  <!-- Diagnose -> Ollama, Plan -> Ollama -->
  <line x1="830" y1="496" x2="830" y2="614" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1045" y1="496" x2="1045" y2="614" stroke="var(--text)" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Ollama -->
  <rect x="735" y="616" width="405" height="70" rx="10" fill="var(--ext-soft)" stroke="var(--ext)" stroke-width="1.8"/>
  <text x="937" y="642" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ext)" class="sans">Ollama — local models</text>
  <text x="937" y="661" text-anchor="middle" font-size="10.5" fill="var(--text-2)">llama3.1:8b (diagnose, plan)</text>
  <text x="937" y="675" text-anchor="middle" font-size="10.5" fill="var(--text-2)">nomic-embed-text (retrieve)</text>

  <!-- completion loop: Plan -> API (right side, orthogonal) -->
  <polyline points="1140,464 1185,464 1185,170 802,170" fill="none" stroke="var(--text)" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
  <text x="1191" y="314" text-anchor="middle" font-size="11" fill="var(--text-2)" transform="rotate(90 1191 314)">diagnosis + plan -&gt; job store</text>

  <!-- postmortem loop: API -> Chroma (left side, orthogonal, distinct color) -->
  <polyline points="410,220 24,220 24,596 556,596 556,614" fill="none" stroke="var(--loop)" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowLoop)"/>
  <text x="17" y="408" text-anchor="middle" font-size="11.5" fill="var(--loop)" transform="rotate(-90 17 408)">POST .../postmortem</text>
  <text x="300" y="589" text-anchor="middle" font-size="11" fill="var(--loop)">if was_correct: new chunk</text>
</svg>

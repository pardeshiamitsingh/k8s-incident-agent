apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-db
type: Opaque
stringData:
  DB_PASSWORD: {{ if .Values.failures.badDbPasswordOrders }}"wrong-password"{{ else }}{{ .Values.ordersDbPassword | quote }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cart-redis-auth
type: Opaque
stringData:
  REDIS_CLIENT_NAME: cart

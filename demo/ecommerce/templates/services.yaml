# frontend: nginx. Readiness path is the bad-probe-frontend injection point.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app: frontend, part-of: ecommerce, tier: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, part-of: ecommerce, tier: web}
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet:
              path: {{ if .Values.failures.badProbeFrontend }}/healthz-missing{{ else }}/{{ end }}
              port: 80
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: {{ if .Values.failures.unschedulableFrontend }}"64"{{ else }}20m{{ end }}
              memory: 32Mi
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app: frontend, part-of: ecommerce}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
# catalog: http-echo. Image tag is the bad-image-catalog injection point.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels: {app: catalog, part-of: ecommerce, tier: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog, part-of: ecommerce, tier: backend}
    spec:
      containers:
        - name: catalog
          image: hashicorp/http-echo:{{ if .Values.failures.badImageCatalog }}1.0-does-not-exist{{ else }}1.0{{ end }}
          args: ["-text=catalog ok", "-listen=:8080"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels: {app: catalog, part-of: ecommerce}
spec:
  selector: {app: catalog}
  ports: [{port: 8080, targetPort: 8080}]
---
# cart: checks Redis at startup, exits non-zero with a log line if unreachable.
# The Secret name is the missing-secret-cart injection point.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels: {app: cart, part-of: ecommerce, tier: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cart}
  template:
    metadata:
      labels: {app: cart, part-of: ecommerce, tier: backend}
    spec:
      containers:
        - name: cart
          image: redis:7-alpine
          command: ["sh", "-c"]
          args:
            - |
              ok=0
              for i in $(seq 1 15); do
                redis-cli -h redis -p 6379 ping >/dev/null 2>&1 && ok=1 && break
                echo "waiting for redis:6379"; sleep 2
              done
              [ "$ok" = 1 ] || { echo "FATAL: cart cannot reach redis:6379"; exit 1; }
              echo "cart ready, connected to redis"
              touch /tmp/ready
              while true; do sleep 30; done
          envFrom:
            - secretRef:
                name: {{ if .Values.failures.missingSecretCart }}cart-redis-auth-v2{{ else }}cart-redis-auth{{ end }}
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ready"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  labels: {app: cart, part-of: ecommerce}
spec:
  selector: {app: cart}
  ports: [{port: 8080, targetPort: 8080}]
---
# orders: authenticates to Postgres at startup. Wrong password -> crash loop
# with the server's own error in the logs (bad-db-password-orders).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: {app: orders, part-of: ecommerce, tier: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders, part-of: ecommerce, tier: backend}
      annotations:
        checksum/orders-db: {{ .Values.failures.badDbPasswordOrders | ternary "wrong" .Values.ordersDbPassword | sha256sum }}
    spec:
      containers:
        - name: orders
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -U {{ .Values.postgres.user }} -q; do echo "waiting for postgres"; sleep 2; done
              PGPASSWORD="$DB_PASSWORD" psql -h postgres -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }} -c 'select 1' \
                || { echo "FATAL: orders cannot authenticate to postgres"; exit 1; }
              echo "orders ready, connected to postgres"
              touch /tmp/ready
              while true; do sleep 30; done
          envFrom:
            - secretRef:
                name: orders-db
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ready"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels: {app: orders, part-of: ecommerce}
spec:
  selector: {app: orders}
  ports: [{port: 8080, targetPort: 8080}]
---
# payment: holds a steady ~20M working set under a 64Mi limit. The
# oom-payment scenario raises the working set past the limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels: {app: payment, part-of: ecommerce, tier: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels: {app: payment, part-of: ecommerce, tier: backend}
    spec:
      containers:
        - name: payment
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "{{ if .Values.failures.oomPayment }}200M{{ else }}20M{{ end }}", "--vm-hang", "0"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels: {app: payment, part-of: ecommerce}
spec:
  selector: {app: payment}
  ports: [{port: 8080, targetPort: 8080}]

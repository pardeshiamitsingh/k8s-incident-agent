# postgres: a Deployment + standalone PVC (not a StatefulSet) so the
# pvc-unbound scenario can swap which claim it mounts and heal back without
# deleting anything (volumeClaimTemplates are immutable).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app: postgres
    part-of: ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
{{- if .Values.failures.pvcUnboundPostgres }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-fast
  labels:
    app: postgres
    part-of: ecommerce
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast-ssd-does-not-exist
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    part-of: ecommerce
    tier: data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        part-of: ecommerce
        tier: data
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ if .Values.failures.pvcUnboundPostgres }}postgres-data-fast{{ else }}postgres-data{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app: postgres, part-of: ecommerce}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app: redis, part-of: ecommerce, tier: data}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, part-of: ecommerce, tier: data}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app: redis, part-of: ecommerce}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
